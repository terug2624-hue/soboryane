<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СОБОРЯНЕ v45</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_dR0ih2xTPTN7gH403UWp6a9E0MwwYKQ",
            authDomain: "soboryane-f9c70.firebaseapp.com",
            projectId: "soboryane-f9c70",
            storageBucket: "soboryane-f9c70.firebasestorage.app",
            messagingSenderId: "868266001348",
            appId: "1:868266001348:web:eb7f66071da6be08d1da91",
            databaseURL: "https://soboryane-f9c70-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'schedule_data');

        // Сохранение всей формы в облако
        window.saveToCloud = () => {
            const inputs = document.querySelectorAll('select, input');
            const data = {};
            inputs.forEach(el => { data[el.id] = el.value; });
            set(dataRef, data).then(() => alert("Сохранено в облаке для всех!"));
        };

        // Авто-загрузка данных для всех
        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = data[id];
                });
            }
        });
    </script>
    <style>
        body { background-color: #1a1d23; color: white; font-family: sans-serif; }
        .card { background: #2d333b; border: 1px solid #444c56; border-radius: 12px; }
        select, input { background: #444c56; color: white; border: 1px solid #57606a; border-radius: 8px; width: 100%; padding: 8px; appearance: none; }
        label { font-size: 10px; color: #8b949e; text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        <h1 class="text-center text-2xl font-bold mb-4 tracking-widest">СОБОРЯНЕ</h1>
        
        <select id="main-holiday" class="mb-6 text-center italic border-blue-500 border-2">
            <option>Воскресенье обычное</option>
            <option>Пасха Христова</option>
            <option>Рождество Господне</option>
        </select>

        <div class="card p-4 mb-4">
            <h2 class="text-blue-400 font-bold mb-3 border-b border-gray-600 pb-1 text-lg">Суббота (Вечер):</h2>
            <div class="mb-3">
                <label>ВСЕНОЩНАЯ</label>
                <select id="vsenoshnaya"><option>-</option><option>о. Николай</option><option>о. Александр</option><option>о. Петр</option></select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div><label>ИСПОВЕДЬ</label><select id="ispoved"><option>-</option><option>о. Николай</option><option>о. Александр</option></select></div>
                <div><label>ПАНИХИДА</label><select id="panihida-v"><option>-</option><option>о. Николай</option><option>о. Александр</option></select></div>
                <div><label>ПОМАЗАНИЕ 1</label><select id="pomaz1"><option>-</option><option>о. Николай</option><option>о. Александр</option></select></div>
                <div><label>ПОМАЗАНИЕ 2</label><select id="pomaz2"><option>-</option><option>о. Николай</option><option>о. Александр</option></select></div>
            </div>
        </div>

        <div class="card p-4 mb-6">
            <h2 class="text-blue-400 font-bold mb-3 border-b border-gray-600 pb-1 text-lg">Воскресенье (Утро):</h2>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div><label>РАННЯЯ</label><select id="rannyaya"><option>-</option><option>о. Николай</option></select></div>
                <div><label>ТРЕБНЫЙ</label><select id="treb1"><option>-</option><option>о. Александр</option></select></div>
                <div><label>ПОЗДНЯЯ</label><select id="pozdnyaya"><option>-</option><option>о. Петр</option></select></div>
                <div><label>ТРЕБНЫЙ</label><select id="treb2"><option>-</option><option>о. Николай</option></select></div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
            <button onclick="saveToCloud()" class="bg-blue-900 py-3 rounded-lg font-bold shadow-lg flex flex-col items-center">
                <span>💾</span> <span class="text-[10px]">СОХР</span>
            </button>
            <button class="bg-orange-500 py-3 rounded-lg font-bold shadow-lg text-black flex flex-col items-center">
                <span>👁</span> <span class="text-[10px]">ВИД</span>
            </button>
            <button class="bg-gray-600 py-3 rounded-lg font-bold shadow-lg flex flex-col items-center">
                <span>🖨</span> <span class="text-[10px]">ПЕЧАТЬ</span>
            </button>
        </div>
    </div>
</body>
</html>
