<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Соборяне v44</title>
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Твои настройки из Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyC_dR0ih2xTPTN7gH403UWp6a9E0MwwYKQ",
            authDomain: "soboryane-f9c70.firebaseapp.com",
            projectId: "soboryane-f9c70",
            storageBucket: "soboryane-f9c70.firebasestorage.app",
            messagingSenderId: "868266001348",
            appId: "1:868266001348:web:eb7f66071da6be08d1da91",
            databaseURL: "https://soboryane-f9c70-default-rtdb.firebaseio.com"
        };

        // Инициализация
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scheduleRef = ref(db, 'schedule');
        const chatRef = ref(db, 'chat');

        // Функции для работы с облаком
        window.saveToCloud = (data) => set(scheduleRef, data);
        window.sendMsgToCloud = (msg) => push(chatRef, { 
            text: msg, 
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
        });

        // Слушаем изменения расписания (синхронизация)
        onValue(scheduleRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(id => {
                    const el = document.getElementById(id);
                    if (el && el !== document.activeElement) el.value = data[id];
                });
            }
        });

        // Слушаем чат (синхронизация)
        onValue(chatRef, (snapshot) => {
            const msgs = snapshot.val();
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            if (msgs) {
                Object.values(msgs).forEach(m => {
                    const div = document.createElement('div');
                    div.className = "bg-white p-2 rounded shadow-sm border-l-4 border-blue-400 text-sm";
                    div.innerHTML = `<span class="text-gray-400 text-[10px] block">${m.time}</span>${m.text}`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            }
        });
    </script>

    <style>
        .ios-fix { -webkit-tap-highlight-color: transparent; }
        body { background: #f0f2f5; font-family: -apple-system, sans-serif; }
        input:focus { outline: 2px solid #3b82f6; background: #eff6ff; }
    </style>
</head>
<body class="p-2 ios-fix">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-blue-800 p-4 text-white text-center">
            <h1 class="text-xl font-bold italic">⛪ Соборяне v44</h1>
            <p class="text-xs opacity-80">Облачная синхронизация активна</p>
        </div>
        
        <div class="p-4">
            <div class="overflow-hidden border rounded-xl mb-6 shadow-sm">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-blue-50 text-blue-900 text-xs uppercase">
                        <tr>
                            <th class="p-3 border-b w-16">День</th>
                            <th class="p-3 border-b">Утро</th>
                            <th class="p-3 border-b">Вечер</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body">
                        </tbody>
                </table>
            </div>

            <div class="bg-gray-100 rounded-2xl p-4 border border-gray-200">
                <h2 class="font-bold text-blue-800 mb-3 flex items-center gap-2">
                    <span>💬</span> Объявления причта
                </h2>
                <div id="chat-box" class="h-48 overflow-y-auto mb-3 space-y-2 p-1 flex flex-col">
                    </div>
                <div class="flex gap-2">
                    <input id="chat-input" type="text" placeholder="Написать..." 
                           class="flex-1 border border-gray-300 rounded-full px-4 py-2 text-sm shadow-inner">
                    <button onclick="handleSendMsg()" 
                            class="bg-blue-600 hover:bg-blue-700 text-white w-10 h-10 rounded-full flex items-center justify-center transition shadow-lg">
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        const body = document.getElementById('schedule-body');

        // Генерируем строки таблицы
        days.forEach((day, i) => {
            const row = document.createElement('tr');
            row.className = "hover:bg-gray-50 transition";
            row.innerHTML = `
                <td class="p-3 border-b font-bold text-gray-500 text-sm">${day}</td>
                <td class="p-2 border-b"><input oninput="updateCloud()" id="m-${i}" type="text" class="w-full p-1.5 border rounded text-sm transition shadow-sm" placeholder="..."></td>
                <td class="p-2 border-b"><input oninput="updateCloud()" id="e-${i}" type="text" class="w-full p-1.5 border rounded text-sm transition shadow-sm" placeholder="..."></td>
            `;
            body.appendChild(row);
        });

        // Функция отправки расписания в облако
        function updateCloud() {
            const data = {};
            days.forEach((_, i) => {
                data[`m-${i}`] = document.getElementById(`m-${i}`).value;
                data[`e-${i}`] = document.getElementById(`e-${i}`).value;
            });
            window.saveToCloud(data);
        }

        // Функция отправки сообщения
        function handleSendMsg() {
            const input = document.getElementById('chat-input');
            if (input.value.trim()) {
                window.sendMsgToCloud(input.value);
                input.value = '';
            }
        }

        // Поддержка Enter в чате
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMsg();
        });

        // Service Worker для PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
